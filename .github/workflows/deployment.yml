name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Git clone repository
        uses: git clone https://github.com/S999Y/CI-CD-GitHub-actions.git

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: install packages
        run: npm install

      - name: run test
        run: npm run check

      - name: create and print hello.txt
        run: |
          echo "hello, world!" > hello.txt
          cat hello.txt
