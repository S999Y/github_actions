name: Deploy-git-runner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Git clone repository
        uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: install packages
        run: npm install

      - name: run test
        run: npm run check

      - name: create and print hello.txt
        run: |
          echo "hello, world!" > hello.txt
          cat hello.txt
